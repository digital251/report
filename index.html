<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>태블릿 충전함 관리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one narrow column. Screen 1 picks grade then class; screen 2 is three large menu buttons; each menu opens its own page. */
:root {
  --bg: #EDF1EF; --surface: #FFFFFF; --surface-2: #F5F8F6; --fg: #17211D; --muted: #5A6A63; --line: #D2DBD6;
  --accent: #1D6B57; --accent-ink: #FFFFFF; --accent-soft: #DCEBE4;
  --bad: #BE3A2A; --bad-soft: #FBE5E0; --warn: #9C6210; --warn-soft: #FAEBCF; --good: #2E7A4E;
  --f-display: "Do Hyeon", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1412; --surface: #17201C; --surface-2: #1D2723; --fg: #E4ECE8; --muted: #98AAA2; --line: #2B3833;
  --accent: #5BBE9E; --accent-ink: #072119; --accent-soft: #1B3830;
  --bad: #F07562; --bad-soft: #3A201B; --warn: #E3A64B; --warn-soft: #3A2C14; --good: #6CC48F; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #17201C; --surface-2: #1D2723; --fg: #E4ECE8; --muted: #98AAA2; --line: #2B3833;
  --accent: #5BBE9E; --accent-ink: #072119; --accent-soft: #1B3830;
  --bad: #F07562; --bad-soft: #3A201B; --warn: #E3A64B; --warn-soft: #3A2C14; --good: #6CC48F; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--accent-ink); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; border: 0; background: none; color: inherit; text-align: left; padding: 0; }
.brand small { font-size: 12px; opacity: .85; letter-spacing: .04em; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.15; }
.top-chip { border: 1.5px solid currentColor; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 600; white-space: nowrap; }
.demo { background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.demo .wrap { padding-block: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo button { border: 0; background: none; text-decoration: underline; color: inherit; padding: 0; font-size: 13px; }

main.wrap { padding-block: 20px 48px; display: flex; flex-direction: column; gap: 18px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.2; text-wrap: balance; }
h3 { font-size: 16px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.back { align-self: flex-start; border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 19px; padding: 4px 0; display: inline-flex; align-items: center; gap: 10px; }
.back-ic { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.back-ic svg { width: 20px; height: 20px; }
.back:hover .back-ic { filter: brightness(1.1); }

/* 1. 학년 · 반 고르기 */
.pick { background: var(--surface); border: 2px solid var(--fg); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.pick-label { font-family: var(--f-display); font-size: 21px; display: flex; align-items: baseline; gap: 8px; }
.pick-label span { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.special { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
select { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 12px; }
.special button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 4px; font-weight: 700; font-size: 16px; }
.special button:hover { border-color: var(--accent); }
.seg button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 14px 4px; font-weight: 700; font-size: 16px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.cls-btn { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cls-btn b { font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.1; }
.cls-btn small { font-size: 11px; color: var(--muted); }
.cls-btn:hover, .seg button:hover { border-color: var(--accent); }
.hint { color: var(--muted); font-size: 14px; padding: 12px; text-align: center; border: 1.5px dashed var(--line); border-radius: 12px; }

/* 2. 메뉴 */
.menu-title { display: flex; flex-direction: column; gap: 2px; }
.menu-title small { color: var(--muted); font-size: 13px; }
.menu { display: flex; flex-direction: column; gap: 12px; }
.menu-btn { border: 2px solid var(--fg); background: var(--surface); border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 14px; text-align: left; min-height: 88px; }
.menu-btn:hover { border-color: var(--accent); }
.menu-btn .ic { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.menu-btn .ic svg { width: 26px; height: 26px; }
.menu-btn .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.menu-btn .tx b { font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.2; }
.menu-btn .tx small { font-size: 13px; color: var(--muted); }
.menu-btn .tx small.bad { color: var(--bad); font-weight: 600; }
.menu-btn .go { color: var(--muted); font-size: 22px; }
.report-box { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.menu-sec { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--bad); text-align: center; margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.tile { border: 2px solid var(--fg); background: var(--surface); border-radius: 16px; padding: 12px 14px; min-height: 84px; display: flex; align-items: center; gap: 12px; text-align: left; }
.tile:hover { border-color: var(--accent); }
.tile .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.tile .ic svg { width: 24px; height: 24px; }
.tile .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font-family: var(--f-display); font-weight: 400; font-size: 21px; line-height: 1.2; word-break: keep-all; }
.tile small { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.tile small.bad { color: var(--bad); font-weight: 600; }
.tile.has { border-color: var(--bad); }
@media (max-width: 360px) { .tiles { grid-template-columns: 1fr; } }

/* 학생 태블릿 번호 */
.board { background: var(--surface); border: 2px solid var(--fg); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.nums { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
.num { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; min-height: 56px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.num .n { font-family: var(--f-mono); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.num .s { font-size: 11px; line-height: 1.2; text-align: center; word-break: keep-all; }
.num.bad { background: var(--bad-soft); border: 1.5px solid var(--bad); color: var(--bad); }
.num.fix { background: var(--warn-soft); border: 1.5px solid var(--warn); color: var(--warn); }
.num:hover { border-color: var(--accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1.5px solid var(--line); background: var(--surface-2); }
.legend i.b { border-color: var(--bad); background: var(--bad-soft); }
.legend i.f { border-color: var(--warn); background: var(--warn-soft); }

/* 충전함 */
.parts { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.part { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.part small { font-size: 12px; color: var(--muted); }
.part b { font-size: 13px; font-weight: 600; line-height: 1.3; word-break: keep-all; }
.part.bad { background: var(--bad-soft); border-color: var(--bad); }
.part.bad b { color: var(--bad); }

/* 공통 */
.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.steps span { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.item-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item-meta { font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.fix { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.empty { text-align: center; color: var(--muted); padding: 18px; font-size: 14px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lab { font-size: 13px; font-weight: 600; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
input[type=text], input[type=date], input[type=number], input[type=password], textarea { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 12px; }
textarea { min-height: 70px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 9px 14px; font-weight: 500; text-align: left; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.danger[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.issue-list { display: flex; flex-direction: column; gap: 8px; }
.issue-list .chip { border-radius: 12px; padding: 13px 14px; font-weight: 600; }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 14px; font-weight: 700; font-size: 16px; }
.primary:disabled { opacity: .5; cursor: default; }
/* 서버에 보내는 동안: 버튼 글자가 깜박이고 작은 원이 돎 */
button.busy, button.busy:disabled { opacity: 1; cursor: progress; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
button.busy .busy-tx { animation: blink 1s ease-in-out infinite; }
button.busy .busy-ring { width: 1em; height: 1em; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; flex: none; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { button.busy .busy-tx { animation-duration: 2s; } }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; font-weight: 600; }
.ghost.sm { padding: 6px 10px; font-size: 13px; }
.lock { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); }
.lock svg { width: 28px; height: 28px; }
.err { color: var(--bad); font-size: 14px; }

.scrim { position: fixed; inset: 0; background: rgba(10,20,16,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.x { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; }
@media (min-width: 600px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; z-index: 30; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
.loading { display: grid; place-items: center; padding: 56px 0; }
.spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

/* 관리자 */
.subtabs { display: flex; gap: 6px; overflow-x: auto; }
.subtabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; white-space: nowrap; }
.subtabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.check-row { display: flex; gap: 10px; align-items: flex-start; flex-direction: row; }
.check-row input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.qr-card { border: 1.5px solid #111; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #fff; color: #111; break-inside: avoid; }
.qr-card b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.qr-card small { font-size: 12px; text-align: center; line-height: 1.4; }
.qr-card small strong { display: block; font-family: var(--f-display); font-weight: 400; font-size: 17px; line-height: 1.25; }
.qr-box { width: 120px; height: 120px; }
.qr-box img, .qr-box canvas { width: 120px !important; height: 120px !important; }
footer.wrap { padding-block: 0 32px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px; font-size: 13px; }

@media (max-width: 420px) {
  .parts { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .num { min-height: 50px; }
  .row2 { grid-template-columns: 1fr; }
  .menu-btn { padding: 14px; }
  .menu-btn .tx b { font-size: 20px; }
}
@media print {
  .top, .demo, footer, .no-print { display: none !important; }
  body { background: #fff; }
  .qr-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="brand" type="button" id="brand" aria-label="처음 화면으로"><small id="schoolName">우리학교</small><b>태블릿 사용대장 및 고장 신고</b></button>
    <button class="top-chip" id="topChip" type="button" hidden></button>
  </div>
</header>
<div class="demo" id="demoBar" hidden>
  <div class="wrap"><span><b>체험 모드</b> · 예시 데이터로 동작하며 실제 시트·메일에는 반영되지 않습니다.</span><button type="button" id="demoReset">예시 초기화</button></div>
</div>
<main class="wrap" id="app"><div class="loading" role="status" aria-label="불러오는 중"><span class="spinner"></span></div></main>
<footer class="wrap">
  <span>고장은 발견한 즉시 신고해 주세요.</span>
  <span>화면 버전 10-27b</span>
  <button type="button" class="link-btn" id="adminLink">관리자</button>
</footer>
<div id="layer"></div>

<script>
/* ───────── 설정 ─────────
 * API_URL: Apps Script 배포 후 받은 웹앱 주소(…/exec). 비워 두면 체험 모드로 동작합니다. */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycby5wyNufh1jgYvEAk2obVV1VnLrL2Q-LgPrjY0occjmZdMhx7RLbm4banhuqvO3EEct/exec',
};

const PARTS = ['도어', '살균램프', '타이머', '전원'];
const OK = '이상무';
const DEMO = !CONFIG.API_URL;
const ICON = {
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6M9 12h6"/></svg>',
  tablet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8v8M11 8v8M15 8v8"/><circle cx="18.5" cy="12" r=".6" fill="currentColor"/></svg>',
  wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5.2 12.4a10.4 10.4 0 0 1 13.6 0"/><path d="M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19.6" r="1.4" fill="currentColor" stroke="none"/></svg>',
  lan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4M5 16v-4h14v4"/></svg>',

/* ───────── API ───────── */
async function api(action, data = {}) {
  const payload = { action, k: state.code, ...data };
  if (state.adminKey) payload.admin = state.adminKey;
  if (DEMO) return Mock.call(action, payload);
  try {
    // text/plain으로 보내야 브라우저의 사전 확인(CORS preflight)이 생기지 않습니다.
    const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch (e) {
      // 서버가 정상 형식이 아닌 화면(구글 오류 페이지 등)을 돌려준 경우: 무엇이 왔는지 보여 줌
      const plain = text.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160);
      return { ok: false, message: `서버(Apps Script)가 올바른 답을 주지 않았습니다 (상태 ${res.status}). 관리 담당 선생님께 이 내용을 알려 주세요: ${plain || '빈 응답'}` };
    }
  } catch (e) {
    return { ok: false, message: '서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요. (' + (e && e.message ? e.message : e) + ')' };
  }
}

function toast(msg) {

/* ───────── 뒤로 가기 ─────────
 * 화면을 옮길 때마다 브라우저 기록을 하나씩 쌓아, 휴대폰 뒤로 가기 키가 앞 화면으로 돌아가게 합니다.
 * go(화면) = 새 화면으로 이동(기록 추가), go(화면, true) = 지금 기록을 바꿔치기, back(대신 갈 화면) = 앞 화면으로. */
const nav = { stack: [], i: -1, seq: 0, sheet: false };
function go(fn, replace) {
  nav.seq++;
  if (nav.sheet) { nav.sheet = false; $layer.innerHTML = ''; history.replaceState({ nav: nav.i }, ''); }
  if (replace || nav.i < 0) { nav.i = Math.max(nav.i, 0); nav.stack[nav.i] = fn; history.replaceState({ nav: nav.i }, ''); }
  else { nav.stack.length = nav.i + 1; nav.stack.push(fn); nav.i++; history.pushState({ nav: nav.i }, ''); }
  return fn();
}
/** QR로 바로 반 메뉴에 들어올 때: 첫 기록을 학년·반 고르기 화면으로 깔아 두어, 뒤로 가기가 브라우저를 닫지 않게 함 */
function seedNav(fn) { nav.stack = [fn]; nav.i = 0; history.replaceState({ nav: 0 }, ''); }
function back(fallback) { if (nav.i > 0) history.back(); else go(fallback, true); }
window.addEventListener('popstate', e => {
  const s = e.state || {};
  if (nav.sheet || $layer.innerHTML) { nav.sheet = false; $layer.innerHTML = ''; if (s.nav === nav.i) return; }
  if (typeof s.nav !== 'number' || s.nav === nav.i || !nav.stack[s.nav]) return;
  nav.i = s.nav; nav.seq++;
  nav.stack[nav.i]();
});

/** 열린 창 닫기. 창을 열 때 쌓은 기록도 함께 되돌립니다. */
function closeSheet() {
  if (!$layer.innerHTML) return;

}
function sheet(title, bodyHTML, onMount) {
  $layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h2>${esc(title)}</h2><button class="x" type="button" id="sheetX" aria-label="닫기">×</button></div>${bodyHTML}</div></div>`;
  if (!nav.sheet && nav.i >= 0) { nav.sheet = true; history.pushState({ nav: nav.i, sheet: true }, ''); }
  document.getElementById('sheetX').onclick = closeSheet;
  document.getElementById('scrim').onclick = e => { if (e.target.id === 'scrim') closeSheet(); };

}
function setChip(text, fn) { $chip.hidden = !text; $chip.textContent = text || ''; $chip.onclick = fn || null; }
function show(html) { closeSheet(); $app.innerHTML = html; window.scrollTo(0, 0); }
const LOADING = '<div class="loading" role="status" aria-label="불러오는 중"><span class="spinner"></span></div>';
/** 버튼을 '보내는 중' 상태로 바꿈(누르지 못하게 하고 글자를 깜박임). 돌려받은 함수를 부르면 원래대로 */
function busy(btn, text) {
  const html = btn.innerHTML;
  btn.disabled = true; btn.classList.add('busy'); btn.setAttribute('aria-busy', 'true');
  btn.innerHTML = `<span class="busy-ring" aria-hidden="true"></span><span class="busy-tx">${esc(text)}</span>`;

/* ───────── 시작 ───────── */
async function boot() {
  document.getElementById('demoBar').hidden = !DEMO;
  if (state.adminMode) return go(renderAdmin, true);
  if (!state.code) return go(renderCodeGate, true);
  // 지난번에 받아 둔 학년·반 목록이 있으면 바로 화면을 띄우고, 새 목록은 뒤에서 받아 옵니다.
  const key = 'tm-init:' + (DEMO ? 'demo' : CONFIG.API_URL);
  let cached = null;
  try { cached = JSON.parse(store.get(key) || 'null'); } catch (e) {}
  const start = r => {
    state.init = r;
    document.getElementById('schoolName').textContent = r.school;
    if (state.cls && r.classes.some(c => c.cls === state.cls)) {
      seedNav(renderHome);
      return go(() => openMenu(state.cls));
    }
    go(renderHome, true);
  };
  if (cached && cached.ok) start(cached);
  // 받아 둔 목록이 없을 때 QR로 들어오면, 반 정보도 같은 요청으로 함께 받아 서버에 두 번 묻지 않습니다.
  const r = await api('init', !cached && state.cls ? { cls: state.cls } : {});
  if (!r.ok) {
    if (r.error === 'CODE') { store.del('tm-code'); store.del(key); state.code = ''; return go(() => renderCodeGate(r.message), true); }
    if (!cached) return renderError(r.message);
    return;
  }
  if (r.data) { if (r.data.ok) { state.cls = r.data.cls; state.data = r.data; } delete r.data; }
  store.set(key, JSON.stringify(r));
  if (!cached) return start(r);
  const changed = JSON.stringify(cached) !== JSON.stringify(r);
  state.init = r;
  document.getElementById('schoolName').textContent = r.school;
  if (!changed) return;
  // 받아 둔 목록과 달라졌으면(예: 기자재 탭 추가) 지금 보고 있는 학년·반 고르기나 반 메뉴를 새 목록으로 다시 그림
  if (!state.data && $app.querySelector('.pick')) renderHome();
  else if (state.data && state.data.cls === state.cls && $app.querySelector('nav.menu') && !nav.sheet) openMenu(state.cls);
}
function renderError(msg) {

}
function renderCodeGate(msg) {
  setChip('');

/* ───────── 화면 1: 학년 고르기 → 반 고르기 ───────── */
function renderHome() {
  state.data = null;

  const classes = state.init.classes;

      ${specials.length ? `<div class="special">${specials.map(c => `<button type="button" data-cls="${esc(c.cls)}">${esc(c.cls)}</button>`).join('')}</div>` : ''}
    </section>

/* ───────── 화면 2: 메뉴 ───────── */
async function loadClass(cls) {
  state.cls = cls;
  const r = await api('class', { cls });
  if (!r.ok) { renderError(r.message); return false; }
  state.data = r; return true;
}
const isStaff = c => ((state.init && state.init.classes) || []).some(x => x.cls === c && x.staff);
const whereShort = r => isStaff(r.cls || state.cls) ? `${r.reporter || ''} 선생님 ${r.target}` : r.target === '태블릿' ? `${r.num}번 태블릿` : r.target === '충전함 칸' ? `충전 칸 ${r.num}번` : r.target;
const whereLong = r => `${clsLabel(r.cls)} ${whereShort(r)}`;
/** 반 화면 안의 메뉴: 뒤로/앞으로 가기로 다시 열 때 그 반 정보가 없으면 먼저 불러옴 */
const inClass = (cls, fn) => async () => {
  if (!state.data || state.data.cls !== cls) {
    show(LOADING);
    const seq = nav.seq;
    if (!(await loadClass(cls)) || seq !== nav.seq) return;
  }
  fn();
};
const openOf = (target) =>state.data.reports.filter(r => Array.isArray(target) ? target.includes(r.target) : r.target === target);

async function openMenu(cls) {
  setChip('반 바꾸기', () => back(renderHome));
  if (!state.data || state.data.cls !== cls) {
    show(LOADING);
    const seq = nav.seq;
    if (!(await loadClass(cls))) return;
    if (seq !== nav.seq) return;   // 불러오는 동안 다른 화면으로 옮겨 갔으면 그리지 않음

  const d = state.data;

  const eq = (state.init.equipment || []);
  const btn = (go, icon, title, sub, bad) => `<button type="button" class="menu-btn" data-go="${esc(go)}"><span class="ic">${icon}</span>
      <span class="tx"><b>${esc(title)}</b><small class="${bad ? 'bad' : ''}">${esc(sub)}</small></span><span class="go" aria-hidden="true">›</span></button>`;
  const tile = (go, icon, title, sub, bad) => `<button type="button" class="tile${bad ? ' has' : ''}" data-go="${esc(go)}"><span class="ic">${icon}</span>
      <span class="tx"><b>${esc(title)}</b><small class="${bad ? 'bad' : ''}">${esc(sub)}</small></span></button>`;
  show(`
    <div class="menu-title"><small>${esc(gradeOf(cls))}</small><h2>${esc(clsLabel(cls))}</h2></div>
    <nav class="menu" aria-label="메뉴">

      <div class="tiles">

        ${tile('cabinet', ICON.box, '충전함', cabBad ? `지금 ${cabBad}곳 이상` : '충전 칸 · 문 · 램프', cabBad)}
        ${eq.map(name => { const n = openOf(name).length; return tile('eq:' + name, iconFor(name), name, n ? `지금 ${n}건 접수됨` : '고장 난 곳을 알려요', n); }).join('')}
      </div>
      </section>

  $app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {

const openList = list => `<section class="form"><h3>처리 중인 신고</h3>

function reportItem(r) {

  return `<div class="item"><div class="item-top"><span class="pill ${pill}">${esc(r.status || '접수')}</span><b>${esc(whereShort(r))}</b><span>${esc(r.issue)}</span></div>

}
function problemField(ph) {

function whoField(ph) {

}
function extraFields() {
  return `<div class="field"><label for="memo">문제점 (선택)</label><textarea id="memo" maxlength="300" placeholder="예: 꽂으면 충전 표시가 깜빡이다 꺼져요"></textarea></div>`;
}
/** list가 있으면 버튼으로 고르기(충전 칸), 없으면 문제점을 직접 적기 */
function reportSheet(title, note, list, build, after) {
  const chips = list && list.length;
  sheet(title, `${note || (chips ? '<p class="muted">어디가 고장인지 하나만 골라 주세요.</p>' : '')}
    <div class="form">${chips ? `<div class="issue-list" role="group" aria-label="증상">${list.map((s, i) => `<button type="button" class="chip danger" aria-pressed="false" data-i="${i}">${esc(s)}</button>`).join('')}</div>${extraFields()}`
      : `${problemField('예: 충전기를 꽂아도 충전이 안 돼요')}`}
    <button type="button" class="primary" id="send" disabled>신고하기</button></div>`,
    el => bindIssue(el, list, build, after));
}
function bindIssue(el, list, build, after, needName) {
  const chips = list && list.length;
  let sel = null;
  const send = el.querySelector('#send');
  const memo = el.querySelector('#memo');
  if (chips) {
    el.querySelectorAll('.issue-list .chip').forEach(c => c.onclick = () => {
      el.querySelectorAll('.issue-list .chip').forEach(x => x.setAttribute('aria-pressed', 'false'));
      c.setAttribute('aria-pressed', 'true'); sel = list[Number(c.dataset.i)]; send.disabled = false;
    });
  } else {
    memo.oninput = () => { send.disabled = !memo.value.trim(); };
  }
  send.onclick = async () => {
    const issue = chips ? sel : memo.value.trim();
    if (!issue) return toast('문제점을 적어 주세요.');
    if (needName && !el.querySelector('#who').value.trim()) return toast('선생님 이름을 적어 주세요.');
    const done = busy(send, '보내는 중…');
    const r = await api('report', { cls: state.cls, memo: chips ? memo.value.trim() : '', reporter: (el.querySelector('#who') || { value: '' }).value.trim(), ...build(issue) });
    if (!r.ok) { done(); return toast(r.message); }
    toast(r.duplicate ? r.message : `${r.message}${r.mailed ? ' 담당 선생님께 메일로 알렸어요.' : ''}`);
    if (r.data && r.data.ok) { state.data = r.data; after(); }      // 신고 응답에 새 반 정보가 함께 옴 (한 번 더 묻지 않음)
    else if (await loadClass(state.cls)) after();
  };
}

    <section class="form"><h3>최근 사용 기록</h3>
      <div class="list">${usage.length ? usage.map(u => `<div class="item"><div class="item-top"><b>${esc(u.date)}</b><span>${esc(u.periods)}교시</span><span class="pill ${u.condition === '이상 있음' ? 'bad' : 'ok'}">${esc(u.condition)}</span></div>
        <div class="item-meta">${esc(u.teacher)}${u.subject ? ' · ' + esc(u.subject) : ''}${u.memo ? ' · ' + esc(u.memo) : ''}</div></div>`).join('') : '<div class="empty">아직 기록이 없어요.</div>'}</div>
    </section>`);
  bindBack();
  const periods = new Set();
  let condition = '이상 없음';
  $app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const p = Number(b.dataset.p); periods.has(p) ? periods.delete(p) : periods.add(p);
    b.setAttribute('aria-pressed', String(periods.has(p)));
  });
  $app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    condition = b.dataset.c; $app.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  const save = document.getElementById('uSave');
  save.onclick = async () => {
    const t = document.getElementById('uTeacher').value.trim();
    const s = document.getElementById('uSubject').value.trim();
    if (!periods.size) return toast('교시를 하나 이상 골라 주세요.');
    if (!t) return toast('선생님 이름을 적어 주세요.');
    const done = busy(save, '저장하는 중…');
    const r = await api('usage', { cls: state.cls, date: document.getElementById('uDate').value, periods: [...periods].sort((a, b) => a - b),
      teacher: t, subject: s, condition, memo: document.getElementById('uMemo').value.trim() });
    if (!r.ok) { done(); return toast(r.message); }
    store.set('tm-teacher', t); store.set('tm-subject', s);
    if (condition === '이상 있음') { toast('저장했어요. 고장 난 번호를 눌러 신고해 주세요.'); if (await loadClass(state.cls)) go(openTablet, true); }
    else { toast(r.message); openUsage(); }
  };
}

/* ───────── 관리자 ───────── */
async function renderAdmin() {
  state.adminMode = true;
  setChip('사용 화면으로', () => { state.adminMode = false; if (nav.i > 0) history.back(); else boot(); });
  if (!state.adminKey) return renderAdminLogin();
  const chk = await api('admin_check');
  if (!chk.ok) { state.adminKey = ''; store.del('tm-admin', true); return renderAdminLogin(chk.message); }
  state.adminCode = chk.code;
  show(`<div class="form no-print" style="gap:10px"><h2>관리자</h2>
    <div class="subtabs" role="tablist">${[['open', '처리할 신고'], ['done', '처리 완료'], ['qr', 'QR 코드']].map(([k, l]) =>
      `<button type="button" role="tab" aria-selected="${state.adminTab === k}" data-at="${k}">${l}</button>`).join('')}</div></div>
    <div id="adminBody">${LOADING}</div>`);
  $app.querySelectorAll('[data-at]').forEach(b => b.onclick = () => { state.adminTab = b.dataset.at; renderAdmin(); });
  if (state.adminTab === 'qr') return renderQR();
  const r = await api('admin_data');
  if (!r.ok) return renderError(r.message);
  const body = document.getElementById('adminBody');
  const whereOf = whereLong;
  const pillOf = s => s === '수리중' ? 'fix' : isOpen(s) ? 'bad' : 'ok';
  if (state.adminTab === 'open') {
    body.innerHTML = `<div class="list">${r.open.length ? r.open.map(x => `<div class="item">
      <div class="item-top"><span class="pill ${pillOf(x.status)}">${esc(x.status || '접수')}</span><b>${esc(whereOf(x))}</b><span>${esc(x.issue)}</span></div>
      <div class="item-meta">${esc(x.at)} 접수${x.reporter ? ' · ' + esc(x.reporter) : ''}${x.memo ? ' · ' + esc(x.memo) : ''}${x.note ? ' · 처리메모: ' + esc(x.note) : ''}</div>
      <input type="text" data-note="${esc(x.id)}" placeholder="처리 메모 (선택) 예: 단자 교체 요청" maxlength="300">
      <div class="actions">${x.status !== '수리중' ? `<button type="button" class="ghost sm" data-st="수리중" data-id="${esc(x.id)}">수리 중으로</button>` : ''}
        <button type="button" class="ghost sm" data-st="완료" data-id="${esc(x.id)}" style="color:var(--accent)">수리 완료</button>
        <button type="button" class="ghost sm" data-st="반려" data-id="${esc(x.id)}">잘못된 신고</button></div></div>`).join('') : '<div class="empty">처리할 신고가 없어요.</div>'}</div>`;
    body.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
      const id = b.dataset.id; const note = (body.querySelector(`[data-note="${CSS.escape(id)}"]`) || {}).value;
      const done = busy(b, '바꾸는 중…');
      const u = await api('admin_update', { id, status: b.dataset.st, note });
      if (!u.ok) { done(); return toast(u.message); }
      toast(`${b.dataset.st}(으)로 바꿨어요.`); renderAdmin();
    });
  } else {
    body.innerHTML = `<div class="list">${r.recentDone.length ? r.recentDone.map(x => `<div class="item"><div class="item-top"><span class="pill ok">${esc(x.status)}</span><b>${esc(whereOf(x))}</b><span>${esc(x.issue)}</span></div>
      <div class="item-meta">${esc(x.at)} 접수 · ${esc(x.doneAt)} 처리${x.note ? ' · ' + esc(x.note) : ''}</div></div>`).join('') : '<div class="empty">아직 처리한 신고가 없어요.</div>'}</div>`;
  }
}
function renderAdminLogin(msg) {
  show(`<div class="panel form"><span class="lock">${ICON.lock}</span><h2>관리자 로그인</h2>
    <p class="muted">${DEMO ? '체험 모드의 관리자 비밀번호는 <b>demo</b> 입니다.' : '학교코드_관리자비밀번호 탭에 적힌 관리자 비밀번호를 입력하세요.'}</p>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    <div class="field"><label for="ak">관리자 비밀번호</label><input type="password" id="ak" autocomplete="current-password"></div>
    <button type="button" class="primary" id="akGo">로그인</button></div>`);
  const go = () => { const v = document.getElementById('ak').value.trim(); if (!v) return; state.adminKey = v; store.set('tm-admin', v, true); renderAdmin(); };
  document.getElementById('akGo').onclick = go;
  document.getElementById('ak').onkeydown = e => { if (e.key === 'Enter') go(); };
}
async function renderQR() {
  const body = document.getElementById('adminBody');
  if (!state.init) { const r = await api('init'); if (r.ok) state.init = r; }
  const base = store.get('tm-base') || (location.origin + location.pathname);
  const canPrint = window.self === window.top;
  body.innerHTML = `<div class="form">
    <div class="field no-print"><label for="baseUrl">웹페이지 주소 (GitHub Pages 등에 올린 주소)</label><input type="text" id="baseUrl" value="${esc(base)}"></div>
    <p class="muted no-print">QR코드에는 반 이름과 학교 코드가 들어 있어요. 찍으면 그 반 메뉴 화면이 바로 열립니다. 충전함 문 바깥쪽에 붙여 두세요.${canPrint ? '' : ' 인쇄는 실제로 올린 웹페이지에서 할 수 있어요.'}</p>
    ${canPrint ? '<button type="button" class="ghost no-print" id="printQR">QR 코드 인쇄</button>' : ''}
    <div class="qr-grid" id="qrGrid"></div></div>`;
  const draw = () => {
    const b = document.getElementById('baseUrl').value.trim(); store.set('tm-base', b);
    const grid = document.getElementById('qrGrid'); grid.innerHTML = '';
    (state.init ? state.init.classes : []).forEach(c => {
      const url = `${b}?c=${encodeURIComponent(c.cls)}&k=${encodeURIComponent(state.adminCode || state.code)}`;
      const card = document.createElement('div'); card.className = 'qr-card';
      card.innerHTML = `<div class="qr-box"></div><b>${esc(clsLabel(c.cls))}</b><small><strong>태블릿 사용대장 및 고장 신고</strong>휴대폰 카메라로 찍어 주세요</small>`;
      grid.appendChild(card);
      if (window.QRCode) new QRCode(card.querySelector('.qr-box'), { text: url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
      else card.querySelector('.qr-box').textContent = 'QR 라이브러리를 불러오지 못했어요';
    });
  };
  document.getElementById('baseUrl').onchange = draw;
  const p = document.getElementById('printQR'); if (p) p.onclick = () => window.print();
  draw();
}

document.getElementById('brand').onclick = () => { if (state.init) go(renderHome); else boot(); };
document.getElementById('adminLink').onclick = () => go(renderAdmin);
document.getElementById('demoReset').onclick = () => { Mock.reset(); state.data = null; toast('예시 데이터를 처음 상태로 돌렸어요.'); boot(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
boot();
</script>
